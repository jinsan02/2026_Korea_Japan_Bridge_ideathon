<text x="646" y="62" font-size="13" text-anchor="middle" class="sub">/solve · 6단계</text>
<rect class="box" x="730" y="20" width="124" height="56" rx="8"/>
<text x="792" y="43" font-size="14" text-anchor="middle" font-weight="600" class="ink">문서 매뉴얼</text>
<text x="792" y="62" font-size="13" text-anchor="middle" class="sub">/tutorial</text>
<rect class="em" x="876" y="20" width="124" height="56" rx="8"/>
<text x="938" y="43" font-size="14" text-anchor="middle" font-weight="600" class="ink">혼자 해보기</text>
<text x="938" y="62" font-size="13" text-anchor="middle" class="sub">/practice</text>
<polyline class="ln" points="124,48 137,48"/>
<polygon class="ah" points="146,48 137,43 137,53"/>
<polyline class="ln" points="270,48 283,48"/>
<polygon class="ah" points="292,48 283,43 283,53"/>
