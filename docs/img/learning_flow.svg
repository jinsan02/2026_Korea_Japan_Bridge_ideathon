<polyline class="ln" points="730,86 730,92 854,92 854,86"/>
<text x="792" y="110" font-size="12.5" text-anchor="middle" class="lbl" font-weight="600">2단계 · 매뉴얼</text>
<polyline class="ln" points="876,86 876,92 1000,92 1000,86"/>
<text x="938" y="110" font-size="12.5" text-anchor="middle" class="lbl" font-weight="600">3–4단계 · 혼자</text>
<rect class="box" x="0" y="170" width="226" height="62" rx="8"/>
<text x="113" y="196" font-size="14" text-anchor="middle" font-weight="600" class="ink">guided · 따라 하기</text>
<text x="113" y="215" font-size="13" text-anchor="middle" class="sub">힌트 1(위치)이 처음부터 보임</text>
<rect class="box" x="250" y="210" width="226" height="62" rx="8"/>
<text x="363" y="236" font-size="14" text-anchor="middle" font-weight="600" class="ink">hinted · 힌트 연습</text>
<text x="363" y="255" font-size="13" text-anchor="middle" class="sub">먼저 답하고, 막히면 힌트 요청</text>
<rect class="box" x="500" y="250" width="226" height="62" rx="8"/>
<text x="613" y="276" font-size="14" text-anchor="middle" font-weight="600" class="ink">solo · 혼자 해보기</text>
<text x="613" y="295" font-size="13" text-anchor="middle" class="sub">AI는 질문만, 제출 후 정답 확인</text>
<rect class="em" x="750" y="290" width="226" height="62" rx="8"/>
<text x="863" y="316" font-size="14" text-anchor="middle" font-weight="600" class="ink">final_check · 확인만</text>
<text x="863" y="335" font-size="13" text-anchor="middle" class="sub">먼저 해석, AI는 빠진 것만 확인</text>
<polyline class="ln" points="226,201 238,201 238,241 241,241"/>
<polygon class="ah" points="250,241 241,236 241,246"/>
<polyline class="ln" points="476,241 488,241 488,281 491,281"/>
<polygon class="ah" points="500,281 491,276 491,286"/>
<polyline class="ln" points="726,281 738,281 738,321 741,321"/>
<polygon class="ah" points="750,321 741,316 741,326"/>
<text x="0" y="150" font-size="12.5" class="lbl" font-weight="600">AI 도움 많음</text>
<text x="1000" y="150" font-size="12.5" text-anchor="end" class="lbl" font-weight="600">사용자가 먼저 해결</text>
<text x="0" y="392" font-size="13" class="lbl">내려가는 조건: 직접 힌트를 요청하지 않고 2/3 이상 정답. 힘들게 통과한 회차에서 도움을 줄이면 연습한 것을 벌주는 셈이라 한 단계씩만 내려간다.</text>
<text x="0" y="416" font-size="13" class="lbl">힌트는 고정 3단계 — 위치 → 단어 → 정답.</text>
