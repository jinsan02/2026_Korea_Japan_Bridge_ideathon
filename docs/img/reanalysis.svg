<polyline class="ln" points="670,38 751,38"/>
<polygon class="ah" points="760,38 751,33 751,43"/>
<text x="715" y="30" font-size="12.5" class="lbl" text-anchor="middle">또 실패</text>
<polyline class="ln" points="370,66 370,73"/>
<polygon class="ah" points="370,82 375,73 365,73"/>
