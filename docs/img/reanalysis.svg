<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 0 1024 322" width="1024" height="322" role="img" aria-label="OpenAI는 gpt-5.6-luna 검증 실패 시 gpt-5.6-terra로 재분석하고, Ollama는 qwen3-vl:4b로 1회 재시도한다. 그래도 실패하면 사용자에게 예시 결과(Fixture) 전환을 제안하고 동의를 받은 뒤에만 경고와 함께 전환한다">
<title>재분석 체인 — 불안전하면 다시 보고, 그래도 안 되면 묻는다</title>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #1f2328; }
  .ink { fill: #1f2328; } .sub { fill: #59636e; } .muted { fill: #818b98; } .lbl { fill: #59636e; }
  .grid { stroke: #eaeef2; stroke-width: 1; } .base { stroke: #afb8c1; stroke-width: 1; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; } .s4 { fill: #eda100; }
  .s5 { fill: #e87ba4; } .s6 { fill: #008300; } .s7 { fill: #4a3aa7; } .s8 { fill: #e34948; }
  .dim { fill: #d0d7de; } .dim2 { fill: #8c959f; }
  .box  { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
  .em   { fill: #e3eefb; stroke: #2a78d6; stroke-width: 1.6; }
  .mute { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
  .k-auto { fill: #e0f5ec; stroke: #1baf7a; stroke-width: 1.4; }
  .k-man  { fill: #fdf3d8; stroke: #eda100; stroke-width: 1.4; }
  .k-todo { fill: none; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .grp { fill: none; stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 3 3; }
  .ln { stroke: #6e7781; stroke-width: 1.4; fill: none; } .ah { fill: #6e7781; }
  .ln-em { stroke: #2a78d6; stroke-width: 2; fill: none; } .ah-em { fill: #2a78d6; }
  .dash { stroke-dasharray: 5 4; }
  @media (prefers-color-scheme: dark) {
    text, .ink { fill: #e6edf3; } .sub, .lbl { fill: #9198a1; } .muted { fill: #8b949e; }
    .grid { stroke: #262c36; } .base { stroke: #59636e; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; } .s4 { fill: #c98500; }
    .s5 { fill: #d55181; } .s6 { fill: #008300; } .s7 { fill: #9085e9; } .s8 { fill: #e66767; }
    .dim { fill: #3d444d; } .dim2 { fill: #6e7681; }
    .box  { fill: #161b22; stroke: #3d444d; }
    .em   { fill: #0f2340; stroke: #3987e5; }
    .mute { fill: #0d1117; stroke: #3d444d; }
    .k-auto { fill: #0c2a1f; stroke: #199e70; } .k-man { fill: #2e2408; stroke: #c98500; } .k-todo { stroke: #6e7681; }
    .grp { stroke: #3d444d; }
    .ln { stroke: #8b949e; } .ah { fill: #8b949e; } .ln-em { stroke: #3987e5; } .ah-em { fill: #3987e5; }
  }
</style>
<text x="0" y="24" font-size="18" font-weight="600" class="ink">재분석 체인 — 불안전하면 다시 보고, 그래도 안 되면 묻는다</text><text x="0" y="48" font-size="14" class="sub">예시 결과로의 전환은 사용자 동의 뒤에만, 이유와 함께 경고 · 파란 상자 = 사용자에게 묻는 지점</text>
