<text x="200" y="152" font-size="13" text-anchor="middle" class="sub">로컬</text>
<polygon class="box" points="370,110 425,138 370,166 315,138"/>
<text x="370" y="143" font-size="13" text-anchor="middle" font-weight="600" class="ink">검증</text>
<rect class="box" x="470" y="110" width="200" height="56" rx="8"/>
<text x="570" y="133" font-size="14" text-anchor="middle" font-weight="600" class="ink">qwen3-vl:4b</text>
<text x="570" y="152" font-size="13" text-anchor="middle" class="sub">같은 모델로 1회 재시도</text>
<rect class="em" x="760" y="110" width="230" height="56" rx="8"/>
<text x="875" y="133" font-size="14" text-anchor="middle" font-weight="600" class="ink">Fixture 제안</text>
<text x="875" y="152" font-size="13" text-anchor="middle" class="sub">동의하면 경고와 함께 전환</text>
<polyline class="ln" points="290,138 306,138"/>
<polygon class="ah" points="315,138 306,133 306,143"/>
<polyline class="ln" points="425,138 461,138"/>
<polygon class="ah" points="470,138 461,133 461,143"/>
<text x="445" y="130" font-size="12.5" class="lbl" text-anchor="middle">불안전</text>
<polyline class="ln" points="670,138 751,138"/>
<polygon class="ah" points="760,138 751,133 751,143"/>
<text x="715" y="130" font-size="12.5" class="lbl" text-anchor="middle">또 실패</text>
<polyline class="ln" points="370,166 370,173"/>
<polygon class="ah" points="370,182 375,173 365,173"/>
<text x="378" y="180" font-size="12" class="lbl">통과하면 그대로 사용</text>
<text x="0" y="226" font-size="13" class="lbl">재분석 트리거(needsSecondOpinion): 문서 종류 판별 실패 · 낮은 신뢰도 · 날짜/금액 충돌 · 근거 없는 행동카드 · 근거 전무</text>
<text x="0" y="246" font-size="13" class="lbl">모델 ID는 .env.local 에서만 바뀐다. Ollama 경로는 아직 미검증이다.</text>
</g>
