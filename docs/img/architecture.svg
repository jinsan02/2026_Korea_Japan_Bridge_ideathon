<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 0 1024 612" width="1024" height="612" role="img" aria-label="브라우저가 사진을 축소하고 EXIF를 지워 서버로 보내면, Provider(OpenAI·Ollama·Fixture)가 분석하고 zod 검증·재분석 판단·hardenAnalysis 안전 규칙을 거쳐 화면에 렌더된다. 이벤트 로그는 문서 내용을 저장할 수 없는 스키마로만 기록된다">
<title>전체 아키텍처 — 프롬프트는 부탁이고, 서버 코드는 보장이다</title>
