<text x="0" y="24" font-size="18" font-weight="600" class="ink">전체 아키텍처 — 프롬프트는 부탁이고, 서버 코드는 보장이다</text><text x="0" y="48" font-size="14" class="sub">브라우저에서 사진을 줄이고 위치정보를 지운 뒤 분석 · 모든 결과는 hardenAnalysis()를 거친다 · 파란 경로 = 화면에 닿는 결과</text>
